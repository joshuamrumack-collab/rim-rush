<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1440"/>
      <stop offset="0.55" stop-color="#140a38"/>
      <stop offset="1" stop-color="#2a0838"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#3b6cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3b6cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="0.5" stop-color="#a9b4cc"/>
      <stop offset="1" stop-color="#e6ebf7"/>
    </linearGradient>
    <linearGradient id="streak" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#31e6ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#31e6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ff3fb4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3fb4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="ballclip"><circle cx="700" cy="520" r="128"/></clipPath>
  </defs>

  <!-- Background tile -->
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="180" fill="url(#spot)"/>
  <!-- Court lines -->
  <g stroke="#5f8cff" stroke-opacity="0.22" stroke-width="5" fill="none">
    <circle cx="512" cy="1010" r="250"/>
    <line x1="0" y1="760" x2="1024" y2="760"/>
    <line x1="512" y1="760" x2="512" y2="1024"/>
  </g>

  <!-- Speed streaks -->
  <g filter="url(#glow)">
    <rect x="70" y="330" width="290" height="22" rx="11" fill="url(#streak)"/>
    <rect x="40" y="420" width="330" height="26" rx="13" fill="url(#streak2)"/>
    <rect x="100" y="515" width="250" height="20" rx="10" fill="url(#streak)"/>
    <rect x="150" y="600" width="190" height="16" rx="8" fill="url(#streak2)"/>
  </g>

  <!-- Drive wheel -->
  <g transform="translate(450 470)">
    <circle r="215" fill="#07070c"/>
    <circle r="215" fill="none" stroke="#1b1b24" stroke-width="10"/>
    <!-- tread -->
    <g stroke="#23232e" stroke-width="12">
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(0)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(30)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(60)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(90)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(120)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(150)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(180)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(210)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(240)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(270)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(300)"/>
      <line x1="0" y1="-215" x2="0" y2="-180" transform="rotate(330)"/>
    </g>
    <!-- aluminium rim with five cut-outs -->
    <circle r="150" fill="url(#rim)"/>
    <circle r="150" fill="none" stroke="#3b6cff" stroke-width="10" filter="url(#glow)"/>
    <g fill="#0d1030">
      <circle cx="0" cy="-92" r="34"/>
      <circle cx="0" cy="-92" r="34" transform="rotate(72)"/>
      <circle cx="0" cy="-92" r="34" transform="rotate(144)"/>
      <circle cx="0" cy="-92" r="34" transform="rotate(216)"/>
      <circle cx="0" cy="-92" r="34" transform="rotate(288)"/>
    </g>
    <circle r="40" fill="#3b6cff"/>
    <circle r="40" fill="#3b6cff" filter="url(#glow)" opacity="0.8"/>
    <circle r="16" fill="#dfe8ff"/>
  </g>

  <!-- Foot guard bars striking the ball -->
  <g stroke-linecap="round" fill="none" filter="url(#glow)">
    <path d="M 560 380 L 620 380 Q 640 380 640 400 L 640 640 Q 640 660 620 660 L 560 660" stroke="#31e6ff" stroke-width="20"/>
    <line x1="580" y1="470" x2="640" y2="470" stroke="#31e6ff" stroke-width="16"/>
    <line x1="580" y1="565" x2="640" y2="565" stroke="#31e6ff" stroke-width="16"/>
  </g>

  <!-- Ball -->
  <g>
    <circle cx="712" cy="520" r="132" fill="#000" opacity="0.35" filter="url(#soft)"/>
    <circle cx="700" cy="520" r="128" fill="#f7f8fb"/>
    <g clip-path="url(#ballclip)" fill="#141a33">
      <polygon points="700,468 742,498 726,548 674,548 658,498"/>
      <polygon points="700,392 724,410 700,428 676,410" transform="translate(0,-6)"/>
      <polygon points="604,470 640,480 636,520 600,528 590,500"/>
      <polygon points="796,470 810,500 800,528 764,520 760,480"/>
      <polygon points="640,610 676,600 690,640 660,656 630,640"/>
      <polygon points="760,610 770,640 740,656 710,640 724,600"/>
    </g>
    <circle cx="700" cy="520" r="128" fill="none" stroke="#c9cfe0" stroke-width="4"/>
    <ellipse cx="655" cy="460" rx="40" ry="22" fill="#ffffff" opacity="0.7" transform="rotate(-30 655 460)"/>
  </g>
  <!-- Impact spark -->
  <g fill="#ffe14a" filter="url(#glow)">
    <polygon points="570,520 600,505 590,520 600,535"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Poppins" font-weight="700" text-anchor="middle">
    <text x="512" y="842" font-size="168" fill="#31e6ff" opacity="0.55" filter="url(#glow)" letter-spacing="6" font-style="italic">RIM RUSH</text>
    <text x="512" y="842" font-size="168" fill="#ffffff" letter-spacing="6" font-style="italic">RIM RUSH</text>
    <text x="512" y="912" font-size="44" fill="#8fb0ff" letter-spacing="14">POWERCHAIR FOOTBALL</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
